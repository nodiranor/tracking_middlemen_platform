version: '3.8'

services:
  caddy:
    image: caddy:2-alpine
    container_name: uztrack_caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: uztrack_app
    restart: unless-stopped
    environment:
      - PORT=8080
      - PUBLIC_DIR=/app/public
      - DATABASE_URL=postgres://uztrack:uztrack_secret@postgres:5432/uztrack_db?sslmode=disable
      - REDIS_URL=redis://redis:6379
      - TZ=Asia/Tashkent
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  postgres:
    image: postgis/postgis:16-3.4-alpine
    container_name: uztrack_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: uztrack
      POSTGRES_PASSWORD: uztrack_secret
      POSTGRES_DB: uztrack_db
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U uztrack -d uztrack_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: uztrack_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 64mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data

volumes:
  pg_data:
  redis_data:
  caddy_data:
  caddy_config:
